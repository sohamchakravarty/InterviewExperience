openapi: 3.0.3
info:
  title: Legacy Order Platform API
  version: 1.0.0
  description: |
    Manual OpenAPI description for the interview service in `legacy-order-platform`.
    This is a handwritten contract based on the current handler behavior, not generated from annotations.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Orders
  - name: Admin
  - name: Health
paths:
  /orders:
    post:
      tags: [Orders]
      summary: Create an order
      description: |
        Creates an order from a JSON payload.
        The handler also reads `X-Request-Id`, though current legacy behavior does not enforce true request-id based idempotency.
      parameters:
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
          description: Client-supplied request identifier for idempotent submission workflows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            examples:
              basic:
                value:
                  customerId: cust-1
                  externalId: web-1001
                  currency: USD
                  promoCode: SAVE10
                  expedite: true
                  items:
                    - sku: A-100
                      quantity: 2
                      unitPrice: 19.95
                    - sku: B-200
                      quantity: 1
                      unitPrice: 5.49
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '500':
          description: Legacy error response for validation, inventory, fraud, or gateway failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Orders]
      summary: List all orders
      responses:
        '200':
          description: Array of created orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /admin/report:
    get:
      tags: [Admin]
      summary: Generate CSV report
      responses:
        '200':
          description: CSV report body
          content:
            text/csv:
              schema:
                type: string
              example: |
                # legacy-order-report
                id,customerId,status,total,currency,createdAt,paymentReference,chargedAmount
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Basic process health and internal counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    OrderRequest:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: string
          example: cust-1
        externalId:
          type: string
          example: web-1001
        currency:
          type: string
          default: USD
          example: USD
        expedite:
          type: boolean
          default: false
        promoCode:
          type: string
          nullable: true
          example: SAVE10
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      required:
        - sku
        - quantity
        - unitPrice
      properties:
        sku:
          type: string
          example: A-100
        quantity:
          type: integer
          format: int32
          example: 2
        unitPrice:
          type: number
          format: double
          example: 19.95
    Order:
      type: object
      required:
        - id
        - customerId
        - externalId
        - status
        - currency
        - total
        - createdAtEpochMillis
        - paymentReference
        - expedite
        - items
      properties:
        id:
          type: string
        customerId:
          type: string
        externalId:
          type: string
        status:
          type: string
          enum: [CREATED, REJECTED, FAILED]
        currency:
          type: string
        total:
          type: number
          format: double
        createdAtEpochMillis:
          type: integer
          format: int64
        paymentReference:
          type: string
        expedite:
          type: boolean
        promoCode:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    HealthResponse:
      type: object
      required:
        - status
        - orders
        - cacheEntries
        - auditEvents
        - reconciliationSnapshots
      properties:
        status:
          type: string
          example: ok
        orders:
          type: integer
          format: int32
        cacheEntries:
          type: integer
          format: int32
        auditEvents:
          type: integer
          format: int32
        reconciliationSnapshots:
          type: integer
          format: int32
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
